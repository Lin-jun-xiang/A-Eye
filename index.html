<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>A-Eye 起步警示</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- 開發工具：?debug=1 啟用除錯面板 + Eruda 手機版 console；?reset=1 清除快取 / SW -->
<script>
  (function () {
    var params;
    try { params = new URLSearchParams(location.search); } catch (_) { return; }

    if (params.get('reset') === '1') {
      document.documentElement.innerHTML =
        '<body style="background:#0a0a0a;color:#fff;font-family:sans-serif;padding:24px;line-height:1.6">' +
        '<h2>🧹 正在清除快取與 Service Worker...</h2>' +
        '<pre id="log" style="font-size:12px;opacity:0.8;white-space:pre-wrap"></pre></body>';
      var logEl = document.getElementById('log');
      var log = function (m) { if (logEl) logEl.textContent += m + '\n'; };
      var tasks = [];
      if ('serviceWorker' in navigator && navigator.serviceWorker &&
          typeof navigator.serviceWorker.getRegistrations === 'function') {
        tasks.push(navigator.serviceWorker.getRegistrations()
          .then(function (rs) {
            log('找到 ' + rs.length + ' 個 Service Worker');
            return Promise.all(rs.map(function (r) {
              return r.unregister().then(function (ok) { log('  unregister: ' + (r.scope || '?') + ' = ' + ok); });
            }));
          }).catch(function (e) { log('SW 清除錯誤: ' + e.message); }));
      }
      if (typeof caches !== 'undefined' && caches.keys) {
        tasks.push(caches.keys().then(function (ks) {
          log('找到 ' + ks.length + ' 個 cache');
          return Promise.all(ks.map(function (k) {
            return caches.delete(k).then(function (ok) { log('  delete: ' + k + ' = ' + ok); });
          }));
        }).catch(function (e) { log('cache 清除錯誤: ' + e.message); }));
      }
      try { localStorage.clear(); log('localStorage 已清除'); } catch (_) {}
      try { sessionStorage.clear(); log('sessionStorage 已清除'); } catch (_) {}
      Promise.all(tasks).then(function () {
        log('\n✅ 完成！3 秒後重新載入...');
        setTimeout(function () { location.replace(location.pathname); }, 3000);
      });
      return;
    }

    if (params.get('debug') === '1' || (location.hash || '').indexOf('debug') >= 0) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/eruda';
      s.onload = function () { if (window.eruda) { eruda.init(); console.log('[A-Eye] Eruda 已啟用'); } };
      document.head.appendChild(s);
    }
  })();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0a0a; color: #fff;
  height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}
#camera { flex: 1; width: 100%; object-fit: cover; background: #111; }

#status-bar {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
  display: flex; align-items: center; gap: 10px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  z-index: 10;
}
#status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #4ade80; flex-shrink: 0; animation: pulse 2s infinite;
}
#status-dot.inactive { background: #666; animation: none; }
#status-text { font-size: 13px; opacity: 0.9; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

#detection-panel {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  z-index: 10;
}
#alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.alert-badge {
  padding: 10px 16px; border-radius: 12px;
  font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  animation: slideUp 0.3s ease-out;
}
.alert-badge.move { background: rgba(59,130,246,0.25); border: 1px solid rgba(59,130,246,0.5); color: #93c5fd; }
.alert-badge.green { background: rgba(34,197,94,0.25); border: 1px solid rgba(34,197,94,0.5); color: #86efac; }
.alert-badge.red { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
.alert-badge.idle { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.55); font-size: 14px; }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

#controls { display: flex; gap: 10px; }
#toggle-btn {
  flex: 1; padding: 14px; border: none; border-radius: 14px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
}
#toggle-btn.start { background: #4ade80; color: #052e16; }
#toggle-btn.stop { background: rgba(239,68,68,0.8); color: #fff; }
.btn-icon { width: 22px; height: 22px; vertical-align: middle; margin-right: 2px; color: currentColor; }
.icon-btn {
  min-width: 48px; padding: 14px 10px;
  border: 1px solid rgba(255,255,255,0.2); border-radius: 14px;
  background: rgba(255,255,255,0.08); color: #fff; font-size: 17px; cursor: pointer;
}

#feature-toggles { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.feature-toggle {
  flex: 1; min-width: 140px;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; font-size: 13px; font-weight: 500;
  cursor: pointer; user-select: none; transition: all 0.2s;
}
.feature-toggle input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4ade80; cursor: pointer; }
.feature-toggle.active { background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.5); color: #bbf7d0; }

#overlay { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }

#debug-panel {
  position: absolute; top: 44px; left: 8px; right: 8px;
  max-height: 42dvh; overflow: auto;
  padding: 8px 10px; z-index: 20; display: none;
  background: rgba(0,0,0,0.72); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 10px; line-height: 1.45; white-space: pre-wrap;
  color: #a7f3d0; pointer-events: none;
}

#flash-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.15s; }
#flash-overlay.active { opacity: 1; }
#flash-overlay.move-flash { background: rgba(59,130,246,0.2); }
#flash-overlay.green-flash { background: rgba(34,197,94,0.25); }
</style>
</head>
<body>

<!-- 品牌記號 Lock Bracket。幾何與 tools/make_icons.py 的 SVG_MARK 同源；
     只吃 currentColor，所以綠底按鈕自動變深綠、狀態列自動變白。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="logo" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 7H11a4 4 0 0 0-4 4v6"/>
      <path d="M31 7h6a4 4 0 0 1 4 4v6"/>
      <path d="M41 31v6a4 4 0 0 1-4 4h-6"/>
      <path d="M7 31v6a4 4 0 0 0 4 4h6"/>
    </g>
    <circle cx="24" cy="24" r="7" fill="currentColor"/>
  </symbol>
</defs></svg>

<video id="camera" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<pre id="debug-panel"></pre>

<div id="status-bar">
  <div id="status-dot" class="inactive"></div>
  <span id="status-text">點擊下方按鈕開始偵測</span>
  <span id="speed-display" style="margin-left:auto;font-size:13px;font-weight:600;opacity:0.85;display:none">-- km/h</span>
</div>

<div id="detection-panel">
  <div id="alerts">
    <div class="alert-badge idle">⏳ 等待啟動...</div>
  </div>
  <div id="feature-toggles">
    <label class="feature-toggle" id="toggle-car-label">
      <input type="checkbox" id="enable-car" checked>
      <span>🚗 前車起步偵測</span>
    </label>
    <label class="feature-toggle" id="toggle-light-label">
      <input type="checkbox" id="enable-light" checked>
      <span>🚦 紅綠燈偵測</span>
    </label>
  </div>
  <div id="controls">
    <button id="toggle-btn" class="start"><svg class="btn-icon"><use href="#logo"/></svg> 開始偵測</button>
    <button id="mark-btn" class="icon-btn" title="標註：前車起步了（錄影時用）" style="display:none">🚩</button>
    <button id="rec-btn" class="icon-btn" title="錄影 + 感測器記錄" style="display:none">⏺</button>
    <button id="pip-btn" class="icon-btn" title="子母畫面" style="display:none">🖼</button>
    <button id="file-btn" class="icon-btn" title="用影片檔取代相機（測試用）">📁</button>
    <button id="debug-btn" class="icon-btn" title="除錯面板" style="opacity:0.4">🔍</button>
    <input type="file" id="file-input" accept="video/*" style="display:none">
  </div>
</div>

<div id="flash-overlay"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
